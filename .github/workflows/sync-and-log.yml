name: Sync & Changelog

on:
  schedule:
    # 10 PM UTC daily
    - cron: "0 22 * * *"
  workflow_dispatch:

jobs:
  sync-and-log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Detect Drift
        id: drift
        run: |
          bash scripts/detect-drift.sh --local . --repo . || echo "drift=true" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Generate Changelog
        run: |
          bash scripts/generate-changelog.sh --repo . --output CHANGELOG.md --limit 50

      - name: Commit Changelog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git diff --cached --quiet || git commit -m "chore: update changelog [skip ci]"
          git push
